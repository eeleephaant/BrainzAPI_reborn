server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: parser_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Оставляем только контейнер parser_app
      - source_labels: [__meta_docker_container_name]
        regex: brainz-parser
        action: keep
      # Используем имя контейнера как label
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            message: message
            logger: logger
            exception: exception