name: brainz-api

services:
  brainz-schedules:
    build:
      context: .
      dockerfile: ./services/BrainzSchedules/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      brainz-auth:
        condition: service_started
    ports:
      - "${SCHEDULES_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_LESSON_NAME}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_SERVICE_URL: http://brainz-auth:8080/auth
      APP_PORT: 8080
      APP_ADDRESS: 0.0.0.0
      APP_ENV: ${APP_ENV:-development}
      PEPPER: ${DEVELOPER_CREDS_PEPPER}
      ARGON2_MEMORY: ${ARGON2_MEMORY}
      ARGON2_TIME: ${ARGON2_TIME}
      ARGON2_THREADS: ${ARGON2_THREADS}
    networks:
      - appnet

  brainz-auth:
    build:
      context: .
      dockerfile: ./services/BrainzAuth/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      APP_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_AUTH_NAME}
      DB_POOL_MAX: ${DB_POOL_MAX}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      PEPPER: ${DEVELOPER_CREDS_PEPPER}
      ARGON2_MEMORY: ${ARGON2_MEMORY}
      ARGON2_TIME: ${ARGON2_TIME}
      ARGON2_THREADS: ${ARGON2_THREADS}
    networks:
      - appnet

  brainz-developers:
    build:
      context: .
      dockerfile: ./services/BrainzDevelopers/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      brainz-auth:
        condition: service_started
    ports:
      - '3333:8080'
    environment:
      APP_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_EXTRA_ALLOW_HEADERS: ${CORS_EXTRA_ALLOW_HEADERS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DEVS_NAME}
      DB_POOL_MAX: ${DB_POOL_MAX}
      ARGON2_MEMORY: ${ARGON2_MEMORY}
      ARGON2_THREADS: ${ARGON2_THREADS}
      ARGON2_TIME: ${ARGON2_TIME}
    networks:
      - appnet

  # brainz-parser:
  #   build: ./services/BrainzParser
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #       restart: true
  #   ports:
  #     - '4444:80'
  #   environment:
  #     DB_HOST: ${DB_HOST}
  #     DB_PORT: ${DB_PORT}
  #     DB_USER: ${DB_USER}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     DB_NAME: ${DB_LESSON_NAME}
  #     REDIS_HOST: ${REDIS_HOST}
  #     REDIS_PORT: ${REDIS_PORT}
  #   networks:
  #     - appnet

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER}
      DB_LESSON_NAME: ${DB_LESSON_NAME}
      DB_DEVS_NAME: ${DB_DEVS_NAME}
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_LESSON_NAME} && pg_isready -U $${DB_USER} -d $${DB_DEVS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.2.1-alpine
    networks:
      - appnet
    command: |
      redis-server --maxmemory 500mb --maxmemory-policy allkeys-lru --appendonly no
    deploy:
      resources:
        limits:
          memory: 500m
          cpus: '0.5'

