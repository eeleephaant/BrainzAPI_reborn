openapi: 3.0.3
info:
  title: BrainzAPI
  version: "0.1"
  description: |
    Combined OpenAPI spec for BrainzAPI microservices.
    Note: services run on different hosts/ports; each operation has its own `servers`.

    **BrainzDevelopers** (port 3333 in local compose): CORS uses `Access-Control-Allow-Credentials: true` and echoes the
    request `Origin` when allowed (not `*`, so `fetch` with `credentials: 'include'` works). Set env `CORS_ALLOWED_ORIGINS`
    to a comma-separated allowlist (e.g. `https://pentapulse.ru`). If unset, any non-empty Origin is accepted (dev only).
    `Access-Control-Allow-Headers: *`, `Access-Control-Expose-Headers: *`, usual methods on preflight.
    After `POST /login`, the session is also stored in an HttpOnly cookie (default `brainz_session`). Session-scoped routes accept either that cookie or header `X-Session-Token`.

tags:
  - name: auth
    description: BrainzAuth service
  - name: developers
    description: |
      Developer registration, login, and session-based API key helpers (default local base `http://127.0.0.1:3333`).
      Session routes: HttpOnly session cookie or `X-Session-Token` (`SessionTokenHeader`). CORS: see top-level `info.description`.
  - name: schedules
    description: BrainzSchedules service
  - name: parser
    description: BrainzParser service

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    SessionTokenHeader:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Session from `POST /login` JSON `token`; same value may be sent as HttpOnly cookie `brainz_session` (see `SESSION_COOKIE_NAME`).
  schemas:
    Error:
      type: object
      additionalProperties: true
    AuthResult:
      type: object
      properties:
        status:
          type: boolean
        error_message:
          type: string
      required: [status]
    Permission:
      type: object
      description: |
        Permission object as used by services. Field casing is Go-struct style.
      properties:
        Action:
          type: string
          enum: [read, write, delete, admin]
        InstitutionID:
          type: integer
          format: int64
          nullable: true
      required: [Action]
    RequestedPermissionDTO:
      type: object
      properties:
        perm:
          $ref: "#/components/schemas/Permission"
      required: [perm]

    RegisterDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 13
          maxLength: 255
      required: [email, password]
    LoginDto:
      allOf:
        - $ref: "#/components/schemas/RegisterDto"
    LoginResponse:
      type: object
      description: |
        JSON `token` duplicates the session value also sent as **HttpOnly** cookie `brainz_session` (name overridable via `SESSION_COOKIE_NAME`).
        Browsers with `credentials: 'include'` receive the cookie automatically; other clients can use the header `X-Session-Token`.
      properties:
        token:
          type: string
      required: [token]
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    DeveloperProfile:
      type: object
      description: Current developer (BrainzDevelopers GET /profile). Passwords and 2FA secrets are never returned.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_confirmed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        role_id:
          type: integer
          minimum: 0
        banned_at:
          type: string
          format: date-time
          nullable: true
        two_factor_enabled:
          type: boolean
      required: [id, email, created_at, role_id, two_factor_enabled]

    ApiKeyCreateDto:
      type: object
      description: Body for **BrainzAuth** `POST /key` (direct). Requires `dev_uuid`.
      properties:
        api_key_name:
          type: string
        dev_uuid:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        ip_whitelist:
          type: array
          items:
            type: string
      required: [api_key_name, dev_uuid]
    ApiKeyCreateSessionRequest:
      type: object
      description: |
        Body for **BrainzDevelopers** `POST /key` (port 3333). Developer is taken from `X-Session-Token`;
        do not send `dev_uuid`.

        **Permissions on the new key** are derived from the developer account `role_id` (not from this body):

        | role_id | Meaning (example) | Permissions embedded in the key |
        |--------:|-------------------|--------------------------------|
        | 0 | Read-only developer | `read` |
        | 1 | Read/write developer | `read`, `write` |

        Other `role_id` values → `403` with `unsupported role`.
      properties:
        api_key_name:
          type: string
        ip_whitelist:
          type: array
          items:
            type: string
      required: [api_key_name]
    ApiKeyCreateResponse:
      type: object
      properties:
        name:
          type: string
        api_key:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [name, api_key, expires_at]
    ApiKeyRemoveDto:
      type: object
      properties:
        key:
          type: string
        dev_uuid:
          type: string
          format: uuid
      required: [key, dev_uuid]
    ApiKeyShareModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        suffix:
          type: string
        prefix:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required: [id, title, suffix, prefix, expires_at]

    ApiKeyUsageDaily:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Start of UTC calendar day for aggregation.
        count:
          type: integer
          minimum: 0
      required: [date, count]

    ApiKeyUsageStats:
      type: object
      description: |
        Per-key usage. `usage_by_day` covers roughly the last 90 days (UTC; exact window is server-defined).
        `total_usage` reflects all successful auth checks recorded in `api_key_usage` (lifetime).
      properties:
        api_key_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        total_usage:
          type: integer
          format: int64
          minimum: 0
        usage_by_day:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyUsageDaily"
      required: [api_key_id, name, created_at, total_usage, usage_by_day]

    ApiKeysUsageResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyUsageStats"
      required: [keys]

    Institution:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        site_link:
          type: string
      required: [id, name]
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required: [id, name]
    Lesson:
      type: object
      additionalProperties: true
    LessonTiming:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
          description: Time of day; date part is ignored by service logic.
          example: "0001-01-01T08:30:00Z"
        end_time:
          type: string
          format: date-time
          description: Time of day; date part is ignored by service logic.
          example: "0001-01-01T10:00:00Z"
      required: [start_time, end_time]
    LessonsTimings:
      type: object
      properties:
        lesson_1:
          $ref: "#/components/schemas/LessonTiming"
        lesson_2:
          $ref: "#/components/schemas/LessonTiming"
        lesson_3:
          $ref: "#/components/schemas/LessonTiming"
        lesson_4:
          $ref: "#/components/schemas/LessonTiming"
        lesson_5:
          $ref: "#/components/schemas/LessonTiming"
        lesson_6:
          $ref: "#/components/schemas/LessonTiming"
      required: [lesson_1, lesson_2, lesson_3, lesson_4, lesson_5, lesson_6]
    DateTimeChangeDTO:
      type: object
      properties:
        institution_id:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date-time
          description: Target date whose lessons will be updated.
          example: "2026-03-20T00:00:00Z"
        lesson_timings:
          $ref: "#/components/schemas/LessonsTimings"
      required: [institution_id, date, lesson_timings]

paths:
  /auth:
    get:
      tags: [auth]
      servers:
        - url: http://127.0.0.1:8081
      summary: Authorize by API key (GET)
      description: |
        BrainzAuth supports GET and POST on `/auth`. Most callers should use POST with JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestedPermissionDTO"
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
    post:
      tags: [auth]
      servers:
        - url: http://127.0.0.1:8081
      summary: Authorize by API key (POST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestedPermissionDTO"
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /key:
    post:
      tags: [auth, developers]
      servers:
        - url: http://127.0.0.1:8081
          description: BrainzAuth — body is ApiKeyCreateDto (requires dev_uuid)
        - url: http://127.0.0.1:3333
          description: BrainzDevelopers — body is ApiKeyCreateSessionRequest; send X-Session-Token
      summary: Create API key
      description: |
        - **BrainzAuth:** use `ApiKeyCreateDto` with `dev_uuid` and permissions.
        - **BrainzDevelopers:** use `ApiKeyCreateSessionRequest` (`api_key_name`, optional `ip_whitelist` only) and header `X-Session-Token`; developer is resolved from the session. Key permissions follow developer `role_id` (see `ApiKeyCreateSessionRequest` description).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ApiKeyCreateDto"
                - $ref: "#/components/schemas/ApiKeyCreateSessionRequest"
      security:
        - ApiKeyHeader: []
        - SessionTokenHeader: []
      responses:
        "200":
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Internal error
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [auth, developers]
      servers:
        - url: http://127.0.0.1:8081
          description: BrainzAuth
      summary: Remove API key (Auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRemoveDto"
      responses:
        "200":
          description: Removed
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Access denied
          content:
            text/plain:
              schema:
                type: string

  /keys/usage:
    get:
      tags: [auth, developers]
      servers:
        - url: http://127.0.0.1:8081
          description: BrainzAuth — requires query `developer_id`
        - url: http://127.0.0.1:3333
          description: BrainzDevelopers — `X-Session-Token` only; do not send `developer_id` (rejected with 400)
      summary: API key usage statistics
      description: |
        Aggregates rows from `api_key_usage` (recorded on successful `/auth` when the gateway sends `X-Original-Path` / `X-Original-Method`).
        **BrainzAuth:** pass `developer_id`. **BrainzDevelopers:** session only — stats are always for the logged-in developer; `developer_id` in the query string is not allowed.
      parameters:
        - in: query
          name: developer_id
          required: false
          description: BrainzAuth only. Must be omitted on BrainzDevelopers (otherwise 400).
          schema:
            type: string
            format: uuid
      security:
        - ApiKeyHeader: []
        - SessionTokenHeader: []
      responses:
        "200":
          description: Per-key usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeysUsageResponse"
        "400":
          description: |
            Bad request — e.g. BrainzDevelopers sent `developer_id` query (not allowed), or invalid body on other operations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: |
            Unauthorized — BrainzDevelopers: missing or invalid `X-Session-Token` for this route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /keys:
    get:
      tags: [auth, developers]
      servers:
        - url: http://127.0.0.1:8081
          description: BrainzAuth — requires query `developer_id`
        - url: http://127.0.0.1:3333
          description: BrainzDevelopers — developer from `X-Session-Token` (no query)
      summary: Get API keys for developer
      description: |
        - **BrainzAuth:** pass `developer_id` query parameter.
        - **BrainzDevelopers:** send `X-Session-Token`; keys are returned for the logged-in developer.
      parameters:
        - in: query
          name: developer_id
          required: false
          description: Required for BrainzAuth; omit when using BrainzDevelopers session.
          schema:
            type: string
            format: uuid
      security:
        - ApiKeyHeader: []
        - SessionTokenHeader: []
      responses:
        "200":
          description: Keys list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeyShareModel"
                required: [keys]

  /register:
    post:
      tags: [developers]
      servers:
        - url: http://127.0.0.1:3333
      summary: Register developer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "400":
          description: Invalid body
          content:
            text/plain:
              schema:
                type: string

  /login:
    post:
      tags: [developers]
      servers:
        - url: http://127.0.0.1:3333
      summary: Login and get session token
      description: |
        On success, response includes `Set-Cookie` with the session token (HttpOnly, SameSite configurable).
        Subsequent requests may send the token via cookie or `X-Session-Token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: OK — JSON body plus Set-Cookie session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Wrong credentials / 2FA required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                type: object

  /profile:
    get:
      tags: [developers]
      servers:
        - url: http://127.0.0.1:3333
      summary: Current developer profile
      description: Requires `X-Session-Token`. Response omits password hash, salt, and 2FA secret; `two_factor_enabled` indicates whether 2FA is configured.
      security:
        - SessionTokenHeader: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProfile"
        "400":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /institution:
    get:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: List institutions (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institution"
    post:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: Create institution (requires write/admin)
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden

  /group:
    get:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: List groups for institution (requires read)
      security:
        - ApiKeyHeader: []
      parameters:
        - in: query
          name: institution_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "403":
          description: Forbidden

  /lessons:
    get:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: Get lessons (requires read)
      security:
        - ApiKeyHeader: []
      parameters:
        - in: query
          name: institution_id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: date
          required: true
          schema:
            type: string
            example: "2026-03-15"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "403":
          description: Forbidden
    post:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: Add lessons (requires write)
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden

  /info-stream:
    get:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: WebSocket info stream
      description: |
        Upgrades to WebSocket. Requires query parameter `institution_id`.
        CheckOrigin allows empty Origin or `https://pentapulse.ru`.
      parameters:
        - in: query
          name: institution_id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "400":
          description: Missing/invalid institution_id
          content:
            text/plain:
              schema:
                type: string

  /lessons/timings:
    put:
      tags: [schedules]
      servers:
        - url: http://127.0.0.1:8080
      summary: Update lesson timings 1..6 for a date and institution (requires write)
      description: |
        Updates start/end times for lessons with numbers 1..6 on the specified day.
        The service applies date from `date` and time-of-day from `lesson_timings.lesson_N`.
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DateTimeChangeDTO"
      responses:
        "200":
          description: Timings updated
        "400":
          description: Invalid payload or timings validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /parse:
    post:
      tags: [parser]
      servers:
        - url: http://127.0.0.1:8000
          description: Default FastAPI dev port (adjust to your deployment)
      summary: Parse XLSX schedule and write to DB
      security:
        - ApiKeyHeader: []
      parameters:
        - in: query
          name: institution_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Parsed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Missing/invalid API key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
