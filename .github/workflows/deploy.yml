name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy using git pull and docker compose
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull --ff-only
          docker compose --env-file .env -f docker-compose.deploy.yml up -d --build
          docker image prune -f
          EOF
          
      - name: 📬 Уведомление в Telegram (Успех)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: -1003742922562
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Деплой Brainz API прошёл успешно!
      
            ┌───────────── Проект ─────────────┐
            │ Репозиторий • ${{ github.repository }}
            │ Ветка       • ${{ github.ref_name }}
            └───────────────────────────────────┘
      
            ┌───────────── Коммит ─────────────┐
            │ ${{ env.COMMIT_TITLE || 'Без названия' }}
            │ ${{ github.sha }}
            └───────────────────────────────────┘
      
            👤 Автор:        @${{ github.actor }}
            🌍 Окружение:    Production
            🔗 Ссылка:       https://pentapulse.ru/brainz/api/v2/main/
            📦 Статус:       Успешно развёрнуто
      
            🕒 Время:        ${{ github.event.head_commit.timestamp || 'сейчас' }}
            🔍 Логи:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  
      - name: 📬 Уведомление в Telegram (Ошибка)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: -1003742922562
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
           🔥 Деплой Brainz API упал!
    
            ┌───────────── Проект ─────────────┐
            │ Репозиторий • ${{ github.repository }}
            │ Ветка       • ${{ github.ref_name }}
            └───────────────────────────────────┘
      
            ┌───────────── Коммит ─────────────┐
            │ ${{ env.COMMIT_TITLE || 'Без названия' }}
            │ ${{ github.sha }}
            └───────────────────────────────────┘
      
            👤 Автор:     @${{ github.actor }}
            ⚠️ Статус:    Ошибка при деплое
            🔍 Логи:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
            Срочно проверьте, что случилось!
